name: Integracion Continua (CI)

on:
  push:
    branches: ["main", "master"]

jobs:
  testeo:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pass
          MYSQL_ROOT_PASSWORD: test_root_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,*"
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_pass
      DB_ROOT_PASSWORD: test_root_pass
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias del sistema (mysqlclient)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django

      - name: Ejecutar pruebas con pytest
        run: |
          pytest app/tests.py usuarios/tests.py --ds=config.settings